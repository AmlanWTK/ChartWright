# Chartwright — local development platform (CP04-L, ADR-0007).
#
# Local stand-ins for the production stack, same technologies where possible:
#   Postgres 16  -> RDS Postgres          (identical engine)
#   Kafka (KRaft)-> MSK                   (identical protocol)
#   Temporal     -> Temporal on EKS       (identical server)
#   Redis 7      -> ElastiCache           (identical protocol)
#   MinIO        -> S3                    (S3-compatible API; swap endpoint in prod)
#
# Usage:  docker compose -f infra/local/docker-compose.yml up -d
#         docker compose -f infra/local/docker-compose.yml down          (keep data)
#         docker compose -f infra/local/docker-compose.yml down -v       (wipe data)
# Or:     make local-up / local-down / local-check
#
# DEV-ONLY credentials. Never reuse anywhere real.

name: chartwright-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: cw-postgres
    environment:
      POSTGRES_USER: chartwright
      POSTGRES_PASSWORD: chartwright_dev # dev-only
      POSTGRES_DB: chartwright
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartwright -d chartwright"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cw-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: cw-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft (no ZooKeeper), dual listeners: internal for containers,
      # host listener on localhost:9092 for apps running on your machine.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: cw-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: chartwright
      POSTGRES_PWD: chartwright_dev # dev-only
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: cw-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080" # http://localhost:8233

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: cw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chartwright
      MINIO_ROOT_PASSWORD: chartwright_dev # dev-only
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the dev bucket (documents) on startup.
  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 chartwright chartwright_dev &&
      mc mb --ignore-existing local/chartwright-documents &&
      echo 'bucket ready'
      "

volumes:
  pg_data:
  kafka_data:
  minio_data:
