[project]
name = "chartwright-extract"
version = "0.1.0"
description = "Structured extraction (CP15): deterministic label-anchored fields with mandatory grounding. ADR-0003/0011."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chartwright-schemas",
    "chartwright-ocr",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartwright_extract"]

[tool.uv.sources]
chartwright-schemas = { workspace = true }
chartwright-ocr = { workspace = true }
