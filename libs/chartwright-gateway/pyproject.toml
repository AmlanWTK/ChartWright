[project]
name = "chartwright-gateway"
version = "0.1.0"
description = "Model Gateway (CP11): the single choke point for all model calls — routing, caching, metering, failover. ADR-0002/0008."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartwright_gateway"]
