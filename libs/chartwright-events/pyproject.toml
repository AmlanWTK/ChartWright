[project]
name = "chartwright-events"
version = "0.1.0"
description = "Shared event publishing: protocol, topics, logging + Kafka publishers (CP10)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartwright_events"]
