[project]
name = "chartwright-preprocess"
version = "0.1.0"
description = "Page normalization + packet splitting (CP13): orientation/skew correction, structural document-boundary detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "pypdfium2>=4.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartwright_preprocess"]
