[project]
name = "chartwright-db"
version = "0.1.0"
description = "Persistence layer: SQLAlchemy models, RLS tenant isolation, audit-on-write, Alembic migrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chartwright-schemas",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartwright_db"]

[tool.uv.sources]
chartwright-schemas = { workspace = true }
