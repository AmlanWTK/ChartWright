[project]
name = "chartwright-classify"
version = "0.1.0"
description = "Document classification (CP14): page image -> DocType via the CP11 model gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chartwright-schemas",
    "chartwright-gateway",
    "pillow>=10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartwright_classify"]

[tool.uv.sources]
chartwright-schemas = { workspace = true }
chartwright-gateway = { workspace = true }
