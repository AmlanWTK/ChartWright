[project]
name = "hello"
version = "0.1.0"
description = "Reference service that proves the Python CI lane (lint, types, tests). Replaced by real services from CP06+."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello"]
