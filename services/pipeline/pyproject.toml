[project]
name = "pipeline"
version = "0.1.0"
description = "Workflow orchestration (CP10): Temporal document lifecycle, Kafka trigger, DLQ, replay."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chartwright-db",
    "chartwright-events",
    "chartwright-preprocess",
    "chartwright-storage",
    "temporalio>=1.7.0",
    "confluent-kafka>=2.5.0",
    "pydantic-settings>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.uv.sources]
chartwright-db = { workspace = true }
chartwright-events = { workspace = true }
chartwright-preprocess = { workspace = true }
chartwright-storage = { workspace = true }
