# Root workspace configuration for Chartwright (Python side).
# Uses uv workspaces: each backend service lives in services/* with its own
# pyproject and shares this tooling configuration.

[project]
name = "chartwright"
version = "0.1.0"
description = "Autonomous Clinical Document Intelligence Platform (monorepo root)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# The root package intentionally has no runtime dependencies; it exists to hold
# shared tooling config and declare the uv workspace below.

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[dependency-groups]
# Dev tooling shared across all workspace members. Install with: uv sync --all-groups
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "boto3-stubs[s3]>=1.34.0",  # type stubs for boto3 (S3 client typing under strict mypy)
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (replaces black, isort, flake8, and more)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "libs"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# A pragmatic, strict-ish rule set. Expand as the codebase grows.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort (import ordering)
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # comprehensions
    "SIM",         # flake8-simplify
    "PTH",         # use pathlib
    "RUF",         # ruff-specific
    "S",           # flake8-bandit (security)
]
ignore = [
    "S101",  # asserts are allowed in tests (see per-file ignores)
]

[tool.ruff.lint.per-file-ignores]
# Tests: allow assert (S101) and seeded random for determinism tests (S311).
"**/tests/**" = ["S101", "S311"]
"**/test_*.py" = ["S101", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["hello", "chartwright"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy: static type checking (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["services", "libs"]
# Monorepo module resolution: with py.typed packages, mypy needs the src roots declared
# so each file maps to exactly one module name (e.g. pipeline.config, never bare config).
explicit_package_bases = true
mypy_path = [
    "libs/chartwright-schemas/src",
    "libs/chartwright-db/src",
    "libs/chartwright-events/src",
    "libs/chartwright-synthdata/src",
    "libs/chartwright-gateway/src",
    "libs/chartwright-ocr/src",
    "libs/chartwright-preprocess/src",
    "libs/chartwright-storage/src",
    "libs/chartwright-classify/src",
    "libs/chartwright-extract/src",
    "services/hello/src",
    "services/ingestion/src",
    "services/pipeline/src",
]
# Monorepo: multiple packages each have a `tests/` dir, which collide as module names.
# Tests are exercised by pytest; mypy focuses on src. (Standard monorepo practice.)
exclude = ["(^|/)tests(/|$)"]

# (tests are excluded from mypy above; pytest owns them)

[[tool.mypy.overrides]]
# rapidocr ships no type information; its results are normalized at the adapter boundary.
module = ["rapidocr_onnxruntime", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pypdfium2 ships no type information (CP13 page rasterization).
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# importlib mode: lets multiple packages have their own tests/ dirs without
# top-level module-name collisions (standard monorepo setup; no tests/__init__.py).
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["services", "libs"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (deselect with -m 'not integration')",
]

[tool.coverage.run]
branch = true
source = ["services", "libs"]
omit = ["**/tests/**", "**/__init__.py", "**/alembic/**"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Core services must meet this bar (CP02 sets the gate; tightened per checkpoint).
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
