# Root workspace configuration for Chartwright (Python side).
# Uses uv workspaces: each backend service lives in services/* with its own
# pyproject and shares this tooling configuration.

[project]
name = "chartwright"
version = "0.1.0"
description = "Autonomous Clinical Document Intelligence Platform (monorepo root)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# The root package intentionally has no runtime dependencies; it exists to hold
# shared tooling config and declare the uv workspace below.

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[dependency-groups]
# Dev tooling shared across all workspace members. Install with: uv sync --all-groups
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (replaces black, isort, flake8, and more)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services", "libs"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# A pragmatic, strict-ish rule set. Expand as the codebase grows.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort (import ordering)
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # comprehensions
    "SIM",         # flake8-simplify
    "PTH",         # use pathlib
    "RUF",         # ruff-specific
    "S",           # flake8-bandit (security)
]
ignore = [
    "S101",  # asserts are allowed in tests (see per-file ignores)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # allow assert in tests
"**/test_*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["hello", "chartwright"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy: static type checking (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["services", "libs"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["services", "libs"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (deselect with -m 'not integration')",
]

[tool.coverage.run]
branch = true
source = ["services", "libs"]
omit = ["**/tests/**", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Core services must meet this bar (CP02 sets the gate; tightened per checkpoint).
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
